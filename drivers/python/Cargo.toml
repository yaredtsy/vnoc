[package]
name = "vnoc-driver-python"
version = "0.1.0"
edition = "2024"
description = "The Python language driver: a thin adapter between the V-NOC driver protocol (plan_vs/07-drivers/01) and the analyzer of language_driver_rs (python-syntax, python-analysis)."

# Its own workspace: its own rust-toolchain.toml (1.99.1, the analyzer repo's) and its own Cargo.lock (ruff only compiles against the
# salsa version that repo's Python workspace is locked to; this lockfile started as a copy of its Cargo.lock at the pinned rev).
[workspace]

[dependencies]
anyhow = "1"
lsp-server = "0.10"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The analyzer comes from one pinned commit of language_driver_rs, all three at the same rev: two revs would build analyzer-core twice
# and the types would not match. For local work, put a `[patch]` section in an uncommitted .cargo/config.toml pointing at the checkout.
python-syntax = { git = "https://github.com/yaredtsy/language_driver_rs", rev = "c989c0f4a7ddb77ab0066f76061e4068acda73ab" }
python-analysis = { git = "https://github.com/yaredtsy/language_driver_rs", rev = "c989c0f4a7ddb77ab0066f76061e4068acda73ab" }
analyzer-core = { git = "https://github.com/yaredtsy/language_driver_rs", rev = "c989c0f4a7ddb77ab0066f76061e4068acda73ab" }

# The wire types are shared with the core (D1): a renamed field breaks the build on both sides, not at run time.
vnoc-driver-protocol = { path = "../../crates/vnoc-driver-protocol" }
serde = { version = "1", features = ["derive"] }
blake3 = "1"

[dev-dependencies]
# the tests parse call trees deeper than serde_json's default limit of 128 levels (the analyzer goes to 256)
serde_json = { version = "1", features = ["unbounded_depth"] }
# Tests check the driver against the domain's golden IDs. The driver itself never depends on the domain (the core picks IDs).
vnoc-domain = { path = "../../crates/vnoc-domain" }

# Dependencies (ruff, ty, salsa) at opt-level 2 even in dev: unoptimised ruff is too slow to test against. Release is for packaging.
[profile.dev.package."*"]
opt-level = 2

# `panic` is NOT "abort": the call-tree worker catches a panic inside one request, answers it with an error and serves the next one
# (src/worker.rs). With "abort" one bad request would end the whole driver, and the core would have to start it again.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
