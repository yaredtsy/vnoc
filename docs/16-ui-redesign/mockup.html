<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>V-NOC UI redesign: mockup</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Static mockup of docs/16-ui-redesign. Fake project ("minicart"), fake call trees, plain JS, no build step.
  Open it in a browser. Icons are VS Code's codicons, loaded from a CDN (needs a network).
  The strip at the bottom is NOT part of the design: it flips theme and the four states (03 §8).
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vscode/codicons@0.0.36/dist/codicon.css">
<style>
:root {
  --bg: #1e1e1e; --side: #252526; --activity: #333333; --border: #3c3c3c; --fg: #cccccc; --dim: #9d9d9d;
  --widget: #252526; --widget-border: #454545; --focus: #007fd4; --sel-active: #04395e; --sel-inactive: #37373d;
  --hover: #2a2d2e; --btn2: #3a3d41; --blue: #3794ff; --err: #f48771; --warn: #cca700; --toolbar-hover: #5a5d5e50;
  --folder: #dcb67a; --file: #75beff; --class: #ee9d28; --function: #b180d7;
  --menu-bg: #252526; --menu-sel: #04395e; --hover-card: #252526; --status: #007acc; --status-fg: #fff;
  --code-kw: #569cd6; --code-str: #ce9178; --code-com: #6a9955; --code-fn: #dcdcaa; --cursor: #aeafad;
  --dot-grid: #333;
}
body.light {
  --bg: #ffffff; --side: #f3f3f3; --activity: #2c2c2c; --border: #d4d4d4; --fg: #3b3b3b; --dim: #717171;
  --widget: #ffffff; --widget-border: #c8c8c8; --focus: #0090f1; --sel-active: #0060c0; --sel-inactive: #e4e6f1;
  --hover: #e8e8e8; --btn2: #e0e0e0; --blue: #0066bf; --err: #e51400; --warn: #bf8803; --toolbar-hover: #b8b8b850;
  --folder: #b8860b; --file: #1a7fc4; --class: #c27a05; --function: #8250c8;
  --menu-bg: #ffffff; --menu-sel: #0060c0; --hover-card: #f3f3f3; --status: #007acc;
  --code-kw: #0000ff; --code-str: #a31515; --code-com: #008000; --code-fn: #795e26; --cursor: #000;
  --dot-grid: #e2e2e2;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 13px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
.mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.codicon { font-size: 16px; line-height: 1; vertical-align: middle; }
.k-folder, .k-project { color: var(--folder); } .k-file { color: var(--file); } .k-class { color: var(--class); } .k-function, .k-method { color: var(--function); }

#app { display: grid; grid-template-columns: 48px 300px minmax(260px, 0.55fr) 2.6fr; grid-template-rows: minmax(0, 1fr) 22px; height: 100vh; }   /* minmax(0, …): a tall sidebar must not stretch the window (it pushed NEEDS ATTENTION off the screen) */
#activity { background: var(--activity); display: flex; flex-direction: column; align-items: center; padding-top: 4px; gap: 2px; }
#activity .a { width: 48px; height: 48px; display: grid; place-items: center; color: #858585; position: relative; }
#activity .a .codicon { font-size: 24px; }
#activity .a.on { color: #fff; } #activity .a.on::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: #fff; }
#status { grid-column: 1 / -1; background: var(--status); color: var(--status-fg); display: flex; align-items: center; padding: 0 10px; gap: 14px; font-size: 12px; }
#status .sp { flex: 1; } #status .mockup { background: #0003; padding: 0 6px; border-radius: 3px; display: flex; gap: 4px; align-items: center; height: 18px; }
#status button { padding: 0 6px; border-radius: 3px; height: 16px; line-height: 16px; } #status button.on { background: #fff3; }

/* ---------- sidebar ---------- */
#side { background: var(--side); display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; border-right: 1px solid var(--border); position: relative; }
.sec-title { height: 35px; padding: 0 8px 0 20px; display: flex; align-items: center; text-transform: uppercase; font-size: 11px; letter-spacing: .3px; color: var(--dim); }
.sec-title .sp { flex: 1; } .sec-title .name { color: var(--fg); }
.tb { display: flex; gap: 2px; } .tb button, .ib { width: 22px; height: 22px; border-radius: 4px; display: grid; place-items: center; color: var(--fg); }
.tb button:hover, .ib:hover { background: var(--toolbar-hover); }
.ib.pressed { background: var(--toolbar-hover); } .ib[disabled] { opacity: .35; pointer-events: none; }
#search { margin: 0 8px 6px; display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 2px; padding: 0 6px; height: 24px; }
#search:focus-within { border-color: var(--focus); }
#search input { flex: 1; background: none; border: 0; outline: 0; color: var(--fg); font: inherit; min-width: 0; }
#panels { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; }   /* 06 §4: more panels than fit → this scrolls; NEEDS ATTENTION below it never moves */
.panel { display: flex; flex-direction: column; min-height: 90px; border-top: 1px solid var(--border); position: relative; flex: 1 1 0; }
.panel:first-child { border-top: 0; } .panel.explore { flex: 0 0 45%; }
/* 06 §4.1: the splitter on the top edge of every panel after the first (VS Code's sash: 4 px, the hover colour after 300 ms) */
.sash { position: absolute; left: 0; right: 0; top: -3px; height: 4px; cursor: row-resize; z-index: 3; }
.sash:hover { transition: background-color .1s .3s; background: var(--focus); } .sash.drag { background: var(--focus); }
body.sashing, body.sashing * { cursor: row-resize !important; user-select: none; }
.panel.active::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--focus); z-index: 2; }
.panel-head { height: 22px; display: flex; align-items: center; padding: 0 6px 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; cursor: pointer; color: var(--fg); background: #ffffff08; flex: none; }
.panel-head .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .panel.active .panel-head .t { font-weight: 700; } .panel-head.preview .t { font-style: italic; }
.panel-head .from { color: var(--dim); text-transform: none; font-weight: 400; }
.focusbar { height: 24px; display: flex; align-items: center; gap: 2px; padding: 0 6px 0 10px; font-size: 12px; flex: none; border-bottom: 1px solid transparent; white-space: nowrap; overflow: hidden; }
.focusbar .codicon { font-size: 14px; color: var(--dim); } .focusbar .crumb { padding: 0 3px; border-radius: 3px; cursor: pointer; color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
.focusbar .crumb:hover { background: var(--hover); color: var(--fg); } .focusbar .crumb.last { color: var(--fg); font-weight: 700; cursor: default; } .focusbar .crumb.last:hover { background: none; }
.focusbar .sep { color: var(--dim); font-size: 11px; } .focusbar .sp { flex: 1; }
.tree { flex: 1; overflow: auto; outline: 0; padding-bottom: 6px; }
.row { height: 22px; display: flex; align-items: center; cursor: pointer; padding-right: 6px; white-space: nowrap; position: relative; outline: 0; }
.row:hover { background: var(--hover); } .row.hl { background: var(--hover); }
.row.sel { background: var(--sel-inactive); } #side:focus-within .row.sel { background: var(--sel-active); color: #fff; }
#side:focus-within .row.sel .desc, #side:focus-within .row.sel .chev { color: #ffffffb0; }
.row:focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }
.row.unknown { opacity: .6; } .row.err .label { color: var(--err); }
.row .chev { width: 16px; height: 22px; display: grid; place-items: center; flex: none; color: var(--dim); }
.row .chev .codicon { font-size: 16px; }
.row .ic { margin-right: 5px; flex: none; display: grid; place-items: center; } .row .ic .codicon { font-size: 16px; }
.row .label { overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 70%; } .row .label b { color: var(--blue); font-weight: 700; }
.row .desc { color: var(--dim); font-size: 12px; margin-left: 8px; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.row .dot { color: var(--cursor); font-size: 10px; margin-left: 6px; flex: none; }
.row .acts { display: none; position: absolute; right: 4px; top: 0; height: 22px; align-items: center; gap: 1px; background: inherit; padding-left: 6px; }
.row:hover .acts, .row.sel .acts { display: flex; } .row .acts .ib { width: 20px; height: 20px; } .row .acts .ib .codicon { font-size: 14px; }
.row.loading-row { color: var(--dim); cursor: default; font-style: italic; } .row.loading-row:hover { background: none; }
.guides { position: absolute; top: 0; bottom: 0; left: 0; pointer-events: none; }
.guides i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--border); opacity: .6; }
.skel { height: 12px; margin: 6px 12px; border-radius: 3px; background: linear-gradient(90deg, var(--hover), var(--sel-inactive), var(--hover)); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
#attention { border-top: 1px solid var(--border); flex: none; }
#attention .sec-title { height: 22px; cursor: pointer; padding-left: 8px; } #attention .badge { background: var(--status); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11px; margin-left: 8px; text-transform: none; }
#attention .items .row { height: 22px; padding-left: 20px; } #attention.flash { animation: flash 1s 2; }
@keyframes flash { 50% { background: var(--sel-active); } }
.msg { padding: 20px 16px; color: var(--dim); text-align: center; } .msg .btn { margin-top: 12px; }
.btn { background: var(--status); color: #fff; padding: 4px 12px; border-radius: 2px; } .btn.sec { background: var(--btn2); color: var(--fg); }
.progress { position: absolute; left: 0; right: 0; height: 2px; overflow: hidden; z-index: 5; display: none; } .progress.on { display: block; }
.progress::before { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: var(--status); animation: slide 1.1s infinite ease-in-out; }
@keyframes slide { from { left: -30%; } to { left: 100%; } }

/* ---------- editor ---------- */
#editor { background: var(--bg); display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--border); }
.tabs { height: 35px; background: var(--side); display: flex; flex: none; }
.tab { padding: 0 14px; display: flex; align-items: center; gap: 6px; background: var(--bg); border-top: 1px solid var(--focus); color: var(--fg); }
.tab.preview span { font-style: italic; }
.code { flex: 1; overflow: auto; padding: 6px 0; font-size: 12.5px; line-height: 19px; }
.code .ln { display: flex; } .code .n { width: 48px; text-align: right; padding-right: 16px; color: var(--dim); flex: none; user-select: none; }
.code .t { white-space: pre; } .code .ln.cur { background: #ffffff0d; } .code .ln.tgt { background: #ffd33d30; outline: 1px solid #ffd33d50; }
.kw { color: var(--code-kw); } .str { color: var(--code-str); } .com { color: var(--code-com); } .fn { color: var(--code-fn); }

/* ---------- canvas ---------- */
#canvasGroup { display: flex; flex-direction: column; min-width: 0; background: var(--bg); position: relative; }
#bar { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 6px; border-bottom: 1px solid var(--border); background: var(--bg); flex: none; position: relative; }
#bar .vr { width: 1px; height: 16px; background: var(--border); }
.chips { display: flex; gap: 4px; align-items: center; }
.chip { height: 20px; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 8px; border: 1px solid var(--widget-border); border-radius: 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }
.chip.on { background: var(--btn2); border-color: transparent; font-weight: 600; } .chip .x { display: grid; place-items: center; border-radius: 50%; } .chip .x:hover { background: var(--toolbar-hover); } .chip .codicon { font-size: 13px; }
.crumbs { flex: 1; display: flex; align-items: center; gap: 1px; min-width: 0; overflow: hidden; white-space: nowrap; font-size: 12px; }
.crumbs .crumb { padding: 1px 4px; border-radius: 3px; cursor: pointer; color: var(--dim); } .crumbs .crumb:hover { background: var(--hover); color: var(--fg); }
.crumbs .crumb.last { color: var(--fg); font-weight: 700; cursor: default; } .crumbs .crumb.last:hover { background: none; }
.crumbs .sep { color: var(--dim); font-size: 12px; opacity: .7; }
#bar .warn { color: var(--warn); }
#canvasBody { flex: 1; position: relative; display: flex; min-height: 0; }
#viewport { flex: 1; position: relative; overflow: hidden; cursor: grab; outline: 0;
  background-image: radial-gradient(var(--dot-grid) 1px, transparent 1px); background-size: 20px 20px; }
#viewport.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke: var(--widget-border); stroke-width: 1; } .edge.call { stroke: var(--blue); stroke-opacity: .7; stroke-width: 1.5; stroke-dasharray: 4 3; }
.edge.path { stroke: var(--focus); stroke-opacity: 1; stroke-width: 2; }
#controls { position: absolute; left: 10px; bottom: 10px; display: flex; flex-direction: column; background: var(--widget); border: 1px solid var(--widget-border); border-radius: 4px; overflow: hidden; z-index: 3; }
#controls button { width: 26px; height: 26px; display: grid; place-items: center; } #controls button:hover { background: var(--hover); } #controls button + button { border-top: 1px solid var(--widget-border); }
#minimap { position: absolute; right: 10px; bottom: 10px; width: 170px; height: 110px; background: var(--widget); border: 1px solid var(--widget-border); border-radius: 4px; z-index: 3; display: none; }
#minimap.on { display: block; } #minimap svg { width: 100%; height: 100%; }
.center-msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--dim); z-index: 2; background: var(--bg); } .center-msg .btn { margin: 12px 4px 0; }

/* card */
.card { position: absolute; width: 260px; height: 72px; display: flex; flex-direction: column; background: var(--widget); border: 1px solid var(--widget-border); border-radius: 4px; cursor: pointer; user-select: none; box-shadow: 0 1px 3px #0003; }
.card::before { content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 3px; border-radius: 4px 0 0 4px; background: var(--folder); }
.card.kind-file::before { background: var(--file); } .card.kind-class::before { background: var(--class); } .card.kind-function::before, .card.kind-method::before { background: var(--function); }
.card.syn { box-shadow: inset 0 0 0 2px #f4877166; }
.card.sel { outline: 2px solid var(--focus); outline-offset: -1px; } .card.sel .hd { background: #0078d422; border-radius: 3px 3px 0 0; }
.card.hl:not(.sel) { outline: 2px dotted var(--focus); outline-offset: -1px; }
.card.cursor::after { content: ""; position: absolute; inset: 3px; border: 1px dashed var(--cursor); pointer-events: none; border-radius: 2px; }
.card.unknown { opacity: .6; } .card.pulse { animation: pulse .5s 2; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px #0078d455; } }
.card .hd { height: 30px; flex: none; display: flex; align-items: center; padding: 0 6px 0 8px; gap: 4px; position: relative; }
.card .chev { width: 18px; height: 22px; display: grid; place-items: center; color: var(--dim); border-radius: 3px; flex: none; } .card .chev:hover { background: var(--toolbar-hover); }
.card .chev.none { visibility: hidden; } .card .chev .codicon { font-size: 16px; } .card .chev.root { color: var(--focus); cursor: default; }
.card .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 auto; }   /* cut at the end; the full name is the tooltip */
/* the buttons: always in the header, dim at rest, lit under the pointer and on the selected card (04 §3). Nothing appears or moves on hover. */
.card .strip { display: flex; flex: none; align-items: center; gap: 0; margin-left: 2px; }
.card .strip .ib { width: 22px; height: 22px; color: var(--dim); } .card .strip .ib:hover { color: var(--fg); background: var(--toolbar-hover); } .card.sel .strip .ib { color: var(--fg); }
.card .strip .ib .codicon { font-size: 14px; }
/* the footer: the counts, always there (blank when empty), each with a tooltip */
.card .foot { height: 20px; flex: none; margin-top: auto; padding: 0 8px 0 33px; display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--dim); }
.card .foot .cnt { display: inline-flex; align-items: center; gap: 2px; padding: 0 4px; height: 16px; border-radius: 3px; } .card .foot .cnt.act { cursor: pointer; } .card .foot .cnt.act:hover { background: var(--toolbar-hover); color: var(--fg); }
.card .foot .codicon { font-size: 12px; }
.card .meta { height: 22px; flex: none; padding: 0 8px 0 33px; display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); font-family: "SF Mono", Menlo, Consolas, monospace; white-space: nowrap; overflow: hidden; }
.card .meta .l { flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; } .card.call .meta .l { flex: none; }   /* a call card's sites always win the room */
.card .meta .r { flex: none; margin-left: auto; white-space: nowrap; } .card .meta .file { color: var(--dim); }   /* the callee's file: dim, no :line, shown whole or not at all (JS hides it) */
.card .meta .site, .card .srow .site { cursor: pointer; color: var(--blue); } .card .meta .site:hover, .card .srow:hover .site { text-decoration: underline; }
.card .meta .codicon { font-size: 12px; vertical-align: -2px; }
.card .meta .err { color: var(--err); } .card .meta .mark { color: var(--dim); }   /* nothing is wrong: not the warning colour */
.card .sitelist { flex: none; margin: 4px 8px 0; font: 11px/18px "SF Mono", Menlo, Consolas, monospace; border-top: 1px solid var(--border); padding-top: 4px; }
.card .srow { display: flex; gap: 10px; height: 18px; padding: 0 4px; border-radius: 3px; cursor: pointer; overflow: hidden; white-space: nowrap; } .card .srow:hover { background: var(--hover); }
.card .srow .site { flex: none; min-width: 52px; } .card .srow .txt { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
.card .codebox { flex: none; margin: 4px 8px 0; border: 1px solid var(--border); border-radius: 3px; background: var(--bg); padding: 6px 8px; height: 190px; overflow: auto; font-size: 11.5px; line-height: 17px; cursor: text; }
.card.skeleton { display: block; pointer-events: none; opacity: .5; } .card.skeleton .sk { height: 10px; border-radius: 3px; margin: 14px 12px 0 24px; background: linear-gradient(90deg, var(--hover), var(--sel-inactive), var(--hover)); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
.spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }

/* docs panel */
/* docs panel: the 0.1 panel's insides, unchanged (07-ui/02 §3, webview/src/docs/DocPanel.tsx); 16 adds only "follows the active context" and the call line */
#docs { width: 340px; border-left: 1px solid var(--border); background: var(--bg); display: none; flex-direction: column; flex: none; position: relative; }
#docs.on { display: flex; }
#docs .dsash { position: absolute; top: 0; bottom: 0; left: -3px; width: 6px; cursor: col-resize; z-index: 3; } #docs .dsash:hover, #docs .dsash.drag { background: var(--focus); opacity: .6; }
#docs .dhead { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--border); flex: none; }
#docs .who { flex: 1; min-width: 0; } #docs .who .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#docs .who .sub { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#docs .pick { display: flex; align-items: center; gap: 4px; max-width: 45%; min-width: 0; height: 24px; padding: 0 6px; border: 1px solid var(--border); border-radius: 2px; background: var(--widget); color: var(--fg); font-weight: 500; font-size: 12px; }
#docs .pick span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } #docs .pick:hover { border-color: var(--focus); }
#docs .callline { color: var(--blue); font-size: 12px; padding: 6px 12px; border-bottom: 1px solid var(--border); flex: none; }
#docs .inner { padding: 16px; overflow: auto; flex: 1; font-size: 13px; line-height: 1.55; }
#docs .md h1 { font-size: 18px; margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); } #docs .md p { margin: 0 0 10px; }
#docs .md code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; background: var(--hover); padding: 1px 4px; border-radius: 3px; }
#docs .empty { margin-top: 40px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; color: var(--dim); } #docs .empty .codicon { font-size: 28px; opacity: .6; }

/* menus, toasts, tooltips */
#menu { position: fixed; z-index: 50; background: var(--menu-bg); border: 1px solid var(--widget-border); border-radius: 5px; box-shadow: 0 4px 16px #0006; padding: 4px 0; min-width: 230px; display: none; font-size: 13px; }
#menu .mi { padding: 3px 12px 3px 24px; display: flex; gap: 20px; cursor: pointer; position: relative; margin: 0 4px; border-radius: 3px; } #menu .mi:hover { background: var(--menu-sel); color: #fff; }
#menu .mi .hint { margin-left: auto; color: var(--dim); } #menu .mi:hover .hint { color: #fffb; } #menu .mi.off { opacity: .4; pointer-events: none; }
#menu .mi.head { font-size: 11px; text-transform: uppercase; letter-spacing: .3px; color: var(--dim); pointer-events: none; padding-left: 12px; opacity: 1; }
#menu .mi .ck { position: absolute; left: 6px; } #menu .sepl { height: 1px; background: var(--border); margin: 4px 8px; }
#qp { position: fixed; top: 36px; left: 50%; transform: translateX(-50%); width: 560px; max-width: 90vw; background: var(--menu-bg); border: 1px solid var(--widget-border); border-radius: 5px; box-shadow: 0 6px 24px #0008; z-index: 70; display: none; padding-bottom: 4px; }

    S.scrollSide = a === "docs"; return run(a, ctxId, id);
  }
  if (e.detail >= 2) return run(vn.role === "call" ? "explore" : "focus", ctxId, id);
  select(ctxId, id); S.scrollSide = true; render();
});
vp.addEventListener("contextmenu", e => {
  e.preventDefault(); const card = e.target.closest(".card[data-id]"), c = act();
  if (card) { const ctxId = card.dataset.ctx, id = card.dataset.id; select(ctxId, id); S.scrollSide = true; render(); return showMenu(e.clientX, e.clientY, nodeMenu(ctxId, VN[id], "canvas"), it => run(it.a, ctxId, id)); }
  const ex = c.kind === "explore";
  showMenu(e.clientX, e.clientY, [{ label: "Fit View", a: "fit" }, { label: "Collapse All", a: "collapseAll" }, "-", { label: "Back", a: "back", off: !c.focus.length }, { label: "Clear Focus", a: "clearFocus", off: !c.focus.length }, { label: "Clear Selection", a: "clearSelection", off: !c.selected }, ...(ex ? ["-", { label: "Close Explore", a: "closeCtx" }] : [])], it => run(it.a, S.active, ""));
});
vp.addEventListener("mouseover", e => { const r = e.target.closest(".card[data-id]"); document.querySelectorAll(".row.hl").forEach(x => x.classList.remove("hl")); if (r) { const row = document.querySelector(`.row[data-id="${CSS.escape(r.dataset.id)}"]`); if (row) row.classList.add("hl"); } });
/* pan and zoom */
let pan = null, panMoved = false;
vp.addEventListener("mousedown", e => { if (e.target.closest(".card, #controls, #minimap, .center-msg")) return; const p = S.vp[S.active]; if (!p) return; pan = { x: e.clientX, y: e.clientY, px: p.x, py: p.y }; panMoved = false; vp.classList.add("panning"); });
addEventListener("mousemove", e => { if (!pan) return; const p = S.vp[S.active]; if (Math.abs(e.clientX - pan.x) + Math.abs(e.clientY - pan.y) > 3) panMoved = true; p.x = pan.px + e.clientX - pan.x; p.y = pan.py + e.clientY - pan.y; applyVp(); });
addEventListener("mouseup", () => { pan = null; vp.classList.remove("panning"); });
function zoomAt(cx, cy, f) { const p = S.vp[S.active]; if (!p) return; const k = Math.max(.25, Math.min(2, p.k * f)); p.x = cx - (cx - p.x) * (k / p.k); p.y = cy - (cy - p.y) * (k / p.k); p.k = k; applyVp(); }
vp.addEventListener("wheel", e => { e.preventDefault(); const r = vp.getBoundingClientRect(); if (e.ctrlKey || e.metaKey) zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.01)); else { const p = S.vp[S.active]; if (!p) return; p.x -= e.deltaX; p.y -= e.deltaY; applyVp(); } }, { passive: false });
/* canvas keys (03 §7) */
vp.addEventListener("keydown", e => {
  const c = act(), all = S.layout ? S.layout.all : [], i = all.findIndex(n => n.vn.id === c.selected), cur = all[i], k = e.key;
  const pick = n => { if (n) { select(c.id, n.vn.id); S.scrollSide = true; S.reveal = { ctx: c.id, id: n.vn.id }; render(); } };
  if (k === "ArrowDown") pick(all[i + 1] || all[0]); else if (k === "ArrowUp") pick(all[i - 1]);
  else if (k === "ArrowRight" && cur) { if (hasChevron(cur.vn) && !cur.open) { toggle(c.id, cur.vn.id, true); render(); } else pick(cur.kids[0]); }
  else if (k === "ArrowLeft" && cur && !e.altKey) { const par = all.find(n => n.kids.includes(cur)); pick(par); }
  else if (k === " " && cur) { toggle(c.id, cur.vn.id); render(); }
  else if (k === "Enter" && cur && (e.metaKey || e.ctrlKey)) run(cur.vn.role === "call" ? "goToSite" : "goToCode", c.id, cur.vn.id);   // a call with several sites: the QuickPick
  else if (k === "Enter" && cur) run(cur.vn.role === "call" ? "explore" : "focus", c.id, cur.vn.id);
  else return; e.preventDefault();
});
/* top bar */
document.getElementById("canvasGroup").addEventListener("click", e => {
  const T = e.target, c = act();
  const close = T.closest("#bar [data-close]"); if (close) { closeCtx(close.dataset.close); return render(); }
  const chip = T.closest("[data-chip]"); if (chip) { S.active = chip.dataset.chip; S.ctx[S.active].preview = false; return render(); }
  const jp = T.closest("#bar [data-jump]"); if (jp) { jump(S.active, +jp.dataset.jump); return render(); }
  const b = T.closest("[data-bar]"); if (!b) return; const k = b.dataset.bar, r = b.getBoundingClientRect();
  if (k === "back") { back(S.active); render(); }
  else if (k === "warn") { flash(document.getElementById("attention")); toast("1 file could not be read → NEEDS ATTENTION"); }
  else if (k === "reveal") { S.reveal = { ctx: S.active, id: c.selected }; render(); }
  else if (k === "docs") { openDocs(); render(); }
  else if (k === "more") showMenu(r.right - 220, r.bottom + 2, [{ label: "Fit View", a: "fit" }, { label: "Collapse All", a: "collapseAll" }, { label: "Show Minimap", a: "mm", check: S.minimap }, "-", { label: "Refresh Structure", a: "refresh" }], it => it.a === "mm" ? (S.minimap = !S.minimap, render()) : run(it.a, S.active, ""));
});
document.getElementById("bar").addEventListener("mouseover", e => { const j = e.target.closest("#bar .crumb[data-jump]"); setHighlight(j ? (+j.dataset.jump ? act().focus[+j.dataset.jump - 1] : null) : null); });
document.getElementById("docs").addEventListener("click", e => {
  const c = act(), vn = c.selected ? VN[c.selected] : null, n = vn && calleeNode(vn);
  const p = e.target.closest("[data-docpick]");
  if (p && n) { const r = p.getBoundingClientRect(), docs = DOCS[n.key] || [];            // the picker: this node's docs by title, then New doc…
    return showMenu(r.left, r.bottom + 2, [...docs.map((d, i) => ({ label: d[0], a: i, check: i === (S.docPick[n.key] || 0) })), "-", { label: "New Doc…", a: "new" }],
      it => it.a === "new" ? run("addDoc", S.active, c.selected) : (S.docPick[n.key] = it.a, renderDocs())); }
  if (e.target.closest("[data-docedit]")) return toast("Opens " + (n ? n.name : "") + "'s doc in a Markdown tab beside the canvas; this panel is its live preview");
  const b = e.target.closest("[data-act]"); if (b) run(b.dataset.act, S.active, c.selected || "");
});
document.getElementById("docs").addEventListener("mousedown", e => {      // drag the left edge: 280 – 800 px, kept in setState
  const sash = e.target.closest(".dsash"); if (!sash) return; e.preventDefault();
  sash.classList.add("drag"); document.body.style.cursor = "col-resize";
  const move = ev => { S.docW = Math.max(280, Math.min(800, innerWidth - ev.clientX)); document.getElementById("docs").style.width = S.docW + "px"; };
  const up = () => { removeEventListener("mousemove", move); removeEventListener("mouseup", up); sash.classList.remove("drag"); document.body.style.cursor = ""; };
  addEventListener("mousemove", move); addEventListener("mouseup", up);
});
/* the code editor's V-NOC submenu (08 §4): the node is the one at the cursor */
document.getElementById("editor").addEventListener("contextmenu", e => {
  e.preventDefault(); const key = S.cursor, vn = mkNode(key, null), c = act(), byName = vn.n.link === "name", fn = vn.n.kind === "function" || vn.n.kind === "class";
  showMenu(e.clientX, e.clientY, [{ label: "V-NOC ▸", head: true }, { label: "Reveal in Sidebar", a: "revealInSidebar" }, { label: "Open in Canvas", a: "openInCanvas" }, { label: "Focus", a: "focus" }, "-",
    ...(fn ? [{ label: "Show Calls", a: "showCalls" }, "-"] : []), { label: "Show Docs", a: "showDocs" }, { label: "Add Doc…", a: "addDoc" }, { label: "Attach a Missing Doc Here…", a: "attach" }, ...(byName ? [{ label: "Write ID", a: "writeId" }] : [])],
    it => run(it.a, c.id, key));
});
/* mockup controls */
document.getElementById("status").addEventListener("click", e => {
  const t = e.target.closest("[data-theme]"); if (t) { document.body.classList.toggle("light", t.dataset.theme === "light"); document.querySelectorAll("[data-theme]").forEach(b => b.classList.toggle("on", b === t)); }
  const s = e.target.closest("[data-state]"); if (s) setView(s.dataset.state);
});
addEventListener("resize", () => { if (S.view === "ready") fit(); });
render(); setTimeout(() => { fit(); }, 0);
</script>
</body>
