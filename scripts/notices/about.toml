# cargo-about's settings for scripts/notices.mjs. A licence not listed here fails the run, so a new dependency under a new licence is a decision, not a surprise.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
# what ships is the release build: a crate only a test, a build script or another platform's code needs is still listed for the platforms below, nothing else
ignore-dev-dependencies = true
ignore-build-dependencies = true
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
