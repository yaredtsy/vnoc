name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter vnoc-webview test
      - name: core
        run: cargo test -p vnoc-domain -p vnoc-driver-protocol
      - name: python driver (own workspace, own toolchain)
        working-directory: drivers/python
        run: cargo build && cargo test
      - name: core integration tests (need the driver built above)
        run: cargo test -p vnoc
      - name: package
        run: node scripts/package.mjs
      - uses: actions/upload-artifact@v4
        with: { name: vsix, path: "*.vsix" }
