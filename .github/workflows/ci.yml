# Lint and test (docs/18-ci-cd.md §3). Packaging is package.yml's job, not this file's.
name: ci
on:
  pull_request:
  push:
    branches: [main] # a branch is tested through its PR; main after a merge
  workflow_dispatch: # a branch without a PR, by hand
  workflow_call: # publish.yml: the same lint and tests before a release
permissions:
  contents: read
concurrency: # a newer push to the same PR cancels the run still going; main and releases are never cancelled
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, pull-requests: read } # paths-filter asks the API for the PR's files
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }} # not a PR (main, a release, by hand): everything runs
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every # a file counts only if it matches all three: not docs, not Markdown
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: lint
          save-cache: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
      - name: rustfmt
        run: |
          cargo fmt --all --check
          (cd drivers/python && cargo fmt --all --check)
      - name: clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          (cd drivers/python && cargo clippy --all-targets -- -D warnings)
      - run: pnpm typecheck

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # one broken system must not hide the other two
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-22.04 # not `latest`: the programs then run on older Linux too (an older glibc)
            window: xvfb-run -a # VS Code needs a display
          - os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: test
          save-cache: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
          vscode-test: "true"
      - name: shared logic (session, tree, focus stack)
        run: pnpm --filter @vnoc/shared test
      - name: webview (layout, keys, markers, markdown)
        run: pnpm --filter vnoc-webview test
      - name: extension unit tests (the shared ones again from the extension, and menus.test.ts)
        run: pnpm --filter vnoc unit
      - name: core
        run: cargo test -p vnoc-domain -p vnoc-driver-protocol
      - name: python driver (own workspace, own toolchain)
        working-directory: drivers/python
        run: cargo build && cargo test
      - name: core integration tests (need the driver built above; also leave target/debug/vnoc for the extension suite)
        run: cargo test -p vnoc
      - name: build the webview and the extension (the extension suite loads them)
        run: pnpm -r build
      - name: extension suite in a real VS Code window (downloads VS Code)
        run: ${{ matrix.window }} pnpm --filter vnoc test

  # The one required check (docs/18 §7.1). A skip nobody asked for is a failure, not a pass.
  ci-ok:
    if: always()
    needs: [changes, lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }} # a matrix: "success" only if every row succeeded
        run: |
          echo "event=$EVENT changes=$CHANGES code=$CODE lint=$LINT test=$TEST"
          [ "$CHANGES" = success ] || { echo "::error::changes did not succeed"; exit 1; }
          if [ "$CODE" = true ]; then
            [ "$LINT" = success ] && [ "$TEST" = success ] || { echo "::error::code changed: lint and test must both succeed"; exit 1; }
          elif [ "$CODE" = false ] && [ "$EVENT" = pull_request ]; then
            [ "$LINT" = skipped ] && [ "$TEST" = skipped ] || { echo "::error::docs-only PR, but lint or test ran and did not skip cleanly"; exit 1; }
          else
            echo "::error::unexpected: code=$CODE on $EVENT"; exit 1
          fi
