name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: shared logic (session, tree, focus stack)
        run: pnpm --filter @vnoc/shared test
      - name: webview (layout, keys, markers, markdown)
        run: pnpm --filter vnoc-webview test
      - name: extension unit tests (the shared ones again from the extension, and menus.test.ts)
        run: pnpm --filter vnoc unit
      - name: core
        run: cargo test -p vnoc-domain -p vnoc-driver-protocol
      - name: python driver (own workspace, own toolchain)
        working-directory: drivers/python
        run: cargo build && cargo test
      - name: core integration tests (need the driver built above; also leave target/debug/vnoc for the extension suite)
        run: cargo test -p vnoc
      - name: build the webview and the extension (the extension suite loads them)
        run: pnpm -r build
      - name: extension suite in a real VS Code window (downloads VS Code; not run locally on CI before: watch the first run)
        run: pnpm --filter vnoc test
      - name: package
        run: node scripts/package.mjs
      - uses: actions/upload-artifact@v4
        with: { name: vsix, path: "*.vsix" }
