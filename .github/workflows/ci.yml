name: ci
on:
  push:
    branches: ["**"] # a tag push runs publish.yml, which calls this file: not twice
  pull_request:
  workflow_call: # publish.yml: the same build and tests, and its VSIX files packaged as pre-releases
    inputs:
      pre-release:
        type: boolean
        default: false
jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # one broken system must not hide the other two
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            extra-target: darwin-x64
          - os: ubuntu-22.04 # not `latest`: the programs then run on older Linux too (an older glibc)
            target: linux-x64
            window: xvfb-run -a # VS Code needs a display
          - os: windows-latest
            target: win32-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # language_driver_rs vendors ruff, whose test snapshots have paths longer than Windows' 260 characters: cargo's own git library cannot check them out, the git program can
      - name: long paths for the git checkout of language_driver_rs
        if: runner.os == 'Windows'
        run: |
          git config --system core.longpaths true
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
      # two toolchains (rust-toolchain.toml: 1.94.1 in the root, 1.99.1 in drivers/python): do not rely on rustup installing them by itself
      - name: rust toolchains
        run: |
          rustup toolchain install
          (cd drivers/python && rustup toolchain install)
      - uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "drivers/python -> target", key: driver, cache-on-failure: true }
      - uses: actions/cache@v4
        with:
          path: extension/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: shared logic (session, tree, focus stack)
        run: pnpm --filter @vnoc/shared test
      - name: webview (layout, keys, markers, markdown)
        run: pnpm --filter vnoc-webview test
      - name: extension unit tests (the shared ones again from the extension, and menus.test.ts)
        run: pnpm --filter vnoc unit
      - name: core
        run: cargo test -p vnoc-domain -p vnoc-driver-protocol
      - name: python driver (own workspace, own toolchain)
        working-directory: drivers/python
        run: cargo build && cargo test
      - name: core integration tests (need the driver built above; also leave target/debug/vnoc for the extension suite)
        run: cargo test -p vnoc
      - name: build the webview and the extension (the extension suite loads them)
        run: pnpm -r build
      - name: extension suite in a real VS Code window (downloads VS Code)
        run: ${{ matrix.window }} pnpm --filter vnoc test
      - name: package ${{ matrix.target }}
        run: node scripts/package.mjs --target ${{ matrix.target }} ${{ inputs.pre-release && '--pre-release' || '' }}
      - uses: actions/upload-artifact@v4
        with: { name: "vsix-${{ matrix.target }}", path: "vnoc-${{ matrix.target }}.vsix" }
      # the Intel Mac build is cross-built on the arm64 runner: packaged, not tested
      - name: package ${{ matrix.extra-target }}
        if: matrix.extra-target
        run: |
          rustup target add x86_64-apple-darwin
          (cd drivers/python && rustup target add x86_64-apple-darwin)
          node scripts/package.mjs --target ${{ matrix.extra-target }} ${{ inputs.pre-release && '--pre-release' || '' }}
      - uses: actions/upload-artifact@v4
        if: matrix.extra-target
        with: { name: "vsix-${{ matrix.extra-target }}", path: "vnoc-${{ matrix.extra-target }}.vsix" }
