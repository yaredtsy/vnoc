name: setup
description: pnpm, Node 22, both Rust toolchains and their caches, pnpm install (docs/18-ci-cd.md §3.3)
inputs:
  cache-key:
    description: "`test`, `lint` or `release-<target>`: one rust-cache per kind of build"
    required: true
  save-cache:
    description: "'true' or 'false', computed by the calling job: does this run save the Rust caches (docs/18 §3.3)"
    default: "false"
  vscode-test:
    description: "'true' to cache extension/.vscode-test (the downloaded VS Code): the test job only"
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with: { node-version: 22, cache: pnpm }
    # language_driver_rs vendors ruff, whose test snapshots have paths longer than Windows' 260 characters: cargo's own git library cannot check them out, the git program can
    - name: long paths for the git checkout of language_driver_rs
      if: runner.os == 'Windows'
      shell: bash
      run: |
        git config --system core.longpaths true
        echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
    # two toolchains (rust-toolchain.toml: 1.94.1 in the root, 1.99.1 in drivers/python): do not rely on rustup installing them by itself
    - name: rust toolchains
      shell: bash
      run: |
        rustup toolchain install
        (cd drivers/python && rustup toolchain install)
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache }}
        cache-on-failure: true
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: "drivers/python -> target"
        key: driver-${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache }}
        cache-on-failure: true
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      if: inputs.vscode-test == 'true'
      with:
        path: extension/.vscode-test
        key: vscode-test-${{ runner.os }}-${{ runner.arch }}
    - name: pnpm install
      shell: bash
      run: pnpm install --frozen-lockfile
