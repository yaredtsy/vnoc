[package]
name = "vnoc-domain"
version = "0.1.0"
edition = "2024"
description = "V-NOC domain types: node IDs, repo paths, location keys, node.toml. No I/O."

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml_edit = "0.22"

[dev-dependencies]
serde_json = "1"
