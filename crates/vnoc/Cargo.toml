[package]
name = "vnoc"
version = "0.1.0"
edition = "2024"
description = "The V-NOC core: speaks LSP-framed JSON-RPC to the editor extension, and the driver wire to language drivers."

[dependencies]
vnoc-domain = { path = "../vnoc-domain" }
vnoc-driver-protocol = { path = "../vnoc-driver-protocol" }

# The core's transport is async-lsp on tokio (VS-D67). Use async_lsp::lsp_types: a second lsp-types crate gives a second, incompatible Request trait.
async-lsp = { version = "0.2", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-std", "io-util", "sync", "time", "fs"] }
tower = "0.5"
pin-project-lite = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ignore = "0.4"
toml_edit = "0.22"

[target.'cfg(not(unix))'.dependencies]
tokio-util = { version = "0.7", features = ["compat"] }
